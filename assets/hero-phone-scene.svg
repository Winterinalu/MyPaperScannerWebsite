<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 620" shape-rendering="geometricPrecision" text-rendering="geometricPrecision" role="img" aria-labelledby="title desc">
  <title id="title">MyPaperScanner phone preview</title>
  <desc id="desc">A crisp phone preview showing the MyPaperScanner document library with local privacy and PDF status notes.</desc>
  <defs>
    <filter id="shadow" x="-20%" y="-20%" width="150%" height="150%"><feDropShadow dx="10" dy="12" stdDeviation="0" flood-color="#151d2c" flood-opacity=".95"/></filter>
    <clipPath id="screenClip"><rect x="245" y="46" width="224" height="486" rx="29"/></clipPath>
  </defs>
  <path d="M470 535c65-34 155-43 230-20v105H320c41-33 86-61 150-85Z" fill="#c9dcff"/>
  <g transform="rotate(7 357 300)" filter="url(#shadow)">
