      <text x="261" y="184" font-size="24" font-weight="800">Good Morning!</text><text x="261" y="204" font-size="10" fill="#65758e">Ready to scan some papers?</text>
      <rect x="258" y="229" width="198" height="82" rx="17" fill="#2d6bff" stroke="#151d2c" stroke-width="3"/>
      <text x="278" y="270" font-size="19" font-weight="800" fill="white">New Scan</text><text x="278" y="289" font-size="10" fill="#dbe8ff">Digitize in seconds</text>
      <circle cx="423" cy="270" r="22" fill="#6595ed"/><text x="414" y="278" font-size="22" fill="white">▣</text>
      <text x="261" y="349" font-size="15" font-weight="500">Quick Tools</text>
      <rect x="258" y="365" width="94" height="68" rx="13" fill="#22c55e" stroke="#151d2c" stroke-width="3"/><rect x="362" y="365" width="94" height="68" rx="13" fill="#f5c63f" stroke="#151d2c" stroke-width="3"/>
      <text x="292" y="395" font-size="18" fill="#151d2c">▣</text><text x="273" y="418" font-size="9" font-weight="800">Images to PDF</text>
      <text x="397" y="395" font-size="18" fill="#151d2c">▰</text><text x="377" y="418" font-size="9" font-weight="800">PDF to Image</text>
      <text x="261" y="469" font-size="15" font-weight="500">Recent Files</text><text x="424" y="469" font-size="10" fill="#2d6bff">See All</text>
      <rect x="258" y="481" width="94" height="53" rx="6" fill="#d2def8" stroke="#151d2c" stroke-width="2"/><rect x="362" y="481" width="94" height="53" rx="6" fill="#fff" stroke="#151d2c" stroke-width="2"/>
      <path d="M262 526h86v-38h-86z" fill="#53627c" opacity=".55"/><path d="M368 490h80m-80 7h70m-70 7h76m-76 7h56" stroke="#7586a1" stroke-width="2"/>
    </g>
  </g>
